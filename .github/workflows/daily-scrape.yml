# Runs the scraper every morning and upserts every posting into Supabase.
#
# One-time setup (see README "Hosting"):
#   Settings -> Secrets and variables -> Actions: add SUPABASE_URL,
#   SUPABASE_SECRET_KEY and any source API keys below.

name: Daily job scrape

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST. GitHub may start it up to ~30 min late.
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: python -m jobscraper
